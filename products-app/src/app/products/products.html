<div class="container">
    <h3>Products</h3>
    <table class="table table-hover">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Description</th>
                <th>Price</th>
                <th>Units</th>
                <th colspan="2">Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let product of products">
                <td>{{ product.id }}</td>
                <td>{{ product.name }}</td>
                <td>{{ product.description }}</td>
                <td>{{ product.price }}</td>
                <td>{{ product.units }}</td>
                <td><button class="btn btn-primary" (click)="updateProduct(product)">Edit</button></td>
                <td><button class="btn btn-danger" (click)="deleteProduct(product._id)">Delete</button></td>
            </tr>
        </tbody>
    </table>
</div>
