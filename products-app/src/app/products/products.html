<div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="mb-0">Products</h3>
    <a routerLink="/add" class="btn btn-primary">+ Add Product</a>
</div>

<div class="alert alert-info" *ngIf="!products.length">No products yet — add one to get started.</div>

<table class="table table-hover" *ngIf="products.length">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Description</th>
            <th>Price</th>
            <th>Units</th>
            <th colspan="2">Actions</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let product of products">
            <td>{{ product.id }}</td>
            <td>{{ product.name }}</td>
            <td>{{ product.description }}</td>
            <td>{{ product.price | currency }}</td>
            <td>{{ product.units }}</td>
            <td><button class="btn btn-sm btn-outline-primary" (click)="updateProduct(product)">Edit</button></td>
            <td><button class="btn btn-sm btn-outline-danger" (click)="deleteProduct(product._id)">Delete</button></td>
        </tr>
    </tbody>
</table>
