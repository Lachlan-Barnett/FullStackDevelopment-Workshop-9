<div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="mb-0">Products</h3>
    <a routerLink="/add" class="btn btn-primary">+ Add Product</a>
</div>

<div class="card shadow-sm" *ngIf="products.length; else empty">
    <table class="table table-hover mb-0 align-middle">
        <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Description</th>
                <th class="text-end">Price</th>
                <th class="text-end">Units</th>
                <th class="text-end" colspan="2">Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let product of products">
                <td>{{ product.id }}</td>
                <td>{{ product.name }}</td>
                <td class="text-muted">{{ product.description }}</td>
                <td class="text-end">{{ product.price | currency }}</td>
                <td class="text-end">
                    <span class="badge" [class.bg-success]="product.units > 0" [class.bg-danger]="product.units === 0">
                        {{ product.units }}
                    </span>
                </td>
                <td class="text-end"><button class="btn btn-sm btn-outline-primary" (click)="updateProduct(product)">Edit</button></td>
                <td class="text-end"><button class="btn btn-sm btn-outline-danger" (click)="deleteProduct(product._id)">Delete</button></td>
            </tr>
        </tbody>
    </table>
</div>

<ng-template #empty>
    <div class="alert alert-info">No products yet — add one to get started.</div>
</ng-template>
