<h3 class="mb-3">Add Product</h3>

<div class="card shadow-sm">
    <div class="card-body">
        <div class="mb-3">
            <label class="form-label">Product ID</label>
            <input type="number" class="form-control" [(ngModel)]="productid" name="productid">
        </div>
        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" [(ngModel)]="productname" name="productname">
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" rows="3" [(ngModel)]="productdesc" name="productdesc"></textarea>
        </div>
        <div class="row">
            <div class="col mb-3">
                <label class="form-label">Price</label>
                <div class="input-group">
                    <span class="input-group-text">$</span>
                    <input type="number" class="form-control" [(ngModel)]="productprice" name="productprice">
                </div>
            </div>
            <div class="col mb-3">
                <label class="form-label">Units</label>
                <input type="number" class="form-control" [(ngModel)]="productunits" name="productunits">
            </div>
        </div>

        <div class="alert alert-warning" *ngIf="message">{{ message }}</div>

        <div class="d-flex gap-2">
            <button class="btn btn-primary" (click)="addNewProduct()">Add New</button>
            <a routerLink="/" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </div>
</div>
