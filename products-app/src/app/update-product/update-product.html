<h3 class="mb-3">Update Product</h3>

<div class="card shadow-sm">
    <div class="card-body">
        <div class="mb-3">
            <label class="form-label">Product ID</label>
            <input type="number" class="form-control" [(ngModel)]="product.id" name="id" disabled>
        </div>
        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" [(ngModel)]="product.name" name="name">
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" rows="3" [(ngModel)]="product.description" name="description"></textarea>
        </div>
        <div class="row">
            <div class="col mb-3">
                <label class="form-label">Price</label>
                <div class="input-group">
                    <span class="input-group-text">$</span>
                    <input type="number" class="form-control" [(ngModel)]="product.price" name="price">
                </div>
            </div>
            <div class="col mb-3">
                <label class="form-label">Units</label>
                <input type="number" class="form-control" [(ngModel)]="product.units" name="units">
            </div>
        </div>

        <div class="d-flex gap-2">
            <button class="btn btn-primary" (click)="updateProduct()">Update</button>
            <a routerLink="/" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </div>
</div>
