<div class="container">
    <h3>Update Product</h3>
    <div class="form-group">
        <label>Product ID</label>
        <input type="number" class="form-control" [(ngModel)]="product.id" name="id" disabled>
    </div>
    <div class="form-group">
        <label>Name</label>
        <input type="text" class="form-control" [(ngModel)]="product.name" name="name">
    </div>
    <div class="form-group">
        <label>Description</label>
        <textarea class="form-control" [(ngModel)]="product.description" name="description"></textarea>
    </div>
    <div class="form-group">
        <label>Price</label>
        <input type="number" class="form-control" [(ngModel)]="product.price" name="price">
    </div>
    <div class="form-group">
        <label>Units</label>
        <input type="number" class="form-control" [(ngModel)]="product.units" name="units">
    </div>
    <button class="btn btn-primary" (click)="updateProduct()">Update</button>
</div>
